<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>text</title>
	<style>
		body{
			display: flex;
			justify-content: center;
			align-items: center;
			margin-top: 40px;
		}
		div{
			width: 350px;
			height: 50px;
			background-color: blueviolet;
			border-radius: 40px;
			animation: mouvement 1s infinite alternate;
		}
		@keyframes mouvement {
			from {
				transform: translateX(0);
			}
			to {
				transform: translateX(30px);
			}
		}
		div:hover{
			background-color: red;
			transition: 1s;
		}
		P{
			color: white;
			text-align: center;
			font-family: sans-serif;
		}
		p:hover{
			font-size: 20px;
			font-weight: bolder;
			transition:1s;
		}
	</style>
</head>
<body>
	<div>
		<p>PROGRAMME INFORMATIQUE</p>
	</div>
</body>
</html>
